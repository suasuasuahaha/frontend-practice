<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* CSS 스타일링 작성 가능한 부분 */
        button {
            /* button에 대한 스타일 적용 가능한 코드 부분 */
            color: blue;
            /* 다른 부분도 추가 작성 가능*/
            padding: 20px;
        }
    </style>
    <!-- style.css 파일을 링킹 해주기 -->
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <button style="color : green" class="btn">저장하기</button>
    <button style="color : green" class="btn">등록하기</button>
    <button style="color : green" class="btn">취소하기</button>
</body>
</html>
