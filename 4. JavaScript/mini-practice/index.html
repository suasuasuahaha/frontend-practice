<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니 계좌 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="card">
      <div class="account-label">입출금통장</div>
      <div class="account-no" id="accountNo">—</div>
      <p class="balance" id="balance">0원</p>
    </div>

    <div class="card">
      <h2>거래내역</h2>
      <div class="filters" id="filters">
        <button type="button" data-filter="all" class="active">전체</button>
        <button type="button" data-filter="deposit">입금</button>
        <button type="button" data-filter="withdraw">출금</button>
      </div>
      <div class="loading" id="loading" hidden>불러오는 중…</div>
      <ul class="tx-list" id="txList"></ul>
      <p class="error" id="listError"></p>
    </div>

    <div class="card">
      <h2>이체하기</h2>
      <form id="transferForm">
        <div class="form-row">
          <input type="number" id="amountInput" placeholder="이체 금액" min="0">
          <button type="submit" class="submit" id="submitBtn" disabled>이체</button>
        </div>
        <p class="error" id="formError"></p>
        <p class="notice" id="formNotice"></p>
      </form>
    </div>

  
</form>

  </div>

  <!-- STEP 4~5 실습용 시작점입니다 -->
  <script src="app.js"></script>
</body>
</html>
